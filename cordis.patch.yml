# Gaussian tool bundle. The official Web bundle supplies the surrounding
# conversation surface; this out-of-tree layer contributes the Gaussian tools.
- insert:
    - id: gaussian
      name: '@gaussian/dsh-plugin-gaussian'
      config:
        backendMode: !!js process.env.GAUSSIAN_BACKEND_MODE ?? 'managed'
        baseUrl: !!js process.env.GAUSSIAN_BACKEND_URL ?? 'http://127.0.0.1:8765'
        requestTimeoutMs: 30000
        maxResponseBytes: 1048576
