name: CI Validation

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  python-and-skills-ci:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mcp.txt

      - name: Build DSH JS bundle
        run: |
          npm install --no-audit --no-fund esbuild@0.25.12
          node scripts/build.mjs

      - name: Run Python test suite (safe mock/unit tests only)
        env:
          GAUSSIAN_ALLOW_REAL_EXECUTION: "false"
        run: |
          python -m unittest discover -s tests -v

      - name: Package & audit Agensi standalone skills
        run: |
          python scripts/package_agensi_skills.py
